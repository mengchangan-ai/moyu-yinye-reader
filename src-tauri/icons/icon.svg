<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0a1b33"/>
      <stop offset="0.5" stop-color="#0e3a63"/>
      <stop offset="1" stop-color="#0f6b85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#6ad7ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6ad7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9dcf7"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe1f0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#03101f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"/>

  <!-- 水波 -->
  <g opacity="0.5">
    <path d="M232 606 C 330 576 420 576 512 604 C 604 632 700 630 792 600" fill="none" stroke="#8fe3ff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
    <path d="M282 650 C 372 624 436 624 512 646 C 590 668 664 666 748 640" fill="none" stroke="#8fe3ff" stroke-opacity="0.28" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 鱼 -->
  <g filter="url(#soft)" transform="translate(512 420) scale(1.02) translate(-490 -448)">
    <path d="M642 448 C 566 366 402 366 330 448 C 402 530 566 530 642 448 Z" fill="url(#fish)"/>
    <path d="M336 448 L 240 384 L 258 448 L 240 512 Z" fill="url(#fish)"/>
    <circle cx="592" cy="432" r="15" fill="#0a1b33"/>
    <path d="M470 500 C 500 522 546 520 566 504" fill="none" stroke="#0a1b33" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 摊开的书 -->
  <g filter="url(#soft)" transform="translate(0 -18)">
    <path d="M512 704 C 416 652 300 648 216 678 L 216 842 C 300 812 416 818 512 872 Z" fill="url(#page)"/>
    <path d="M512 704 C 608 652 724 648 808 678 L 808 842 C 724 812 608 818 512 872 Z" fill="url(#page)"/>
    <path d="M512 704 L 512 872" stroke="#0a1b33" stroke-opacity="0.3" stroke-width="11"/>
    <g stroke-linecap="round" stroke-width="15">
      <path d="M272 716 L 440 726" stroke="#0a84ff" stroke-opacity="0.9"/>
      <path d="M272 758 L 386 768" stroke="#2f9bd6" stroke-opacity="0.85"/>
      <path d="M272 800 L 448 808" stroke="#63798f" stroke-opacity="0.8"/>
      <path d="M584 726 L 752 716" stroke="#0a84ff" stroke-opacity="0.9"/>
      <path d="M584 768 L 698 758" stroke="#b8598f" stroke-opacity="0.85"/>
      <path d="M584 808 L 760 800" stroke="#63798f" stroke-opacity="0.8"/>
    </g>
  </g>
</svg>
